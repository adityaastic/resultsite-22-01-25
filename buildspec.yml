version: 0.2

env:
  image: "aws/codebuild/standard:5.0"  # Docker-enabled CodeBuild image

phases:
  install:
    commands:
      - echo Installing Node.js...
      - node --version  # Verify Node.js installation
      - npm --version   # Verify npm installation

  pre_build:
    commands:
      - echo Installing dependencies...
      - npm install      # Install Node.js dependencies

  build:
    commands:
      - echo Building Node.js app...
      - npm run build     # Build the app (replace with your custom build script)

  post_build:
    commands:
      - echo Node.js app build complete.

artifacts:
  files:
    - scripts/docker_up.sh
    - scripts/install_dependencies.sh
    - scripts/reconnect_target_group.sh
    - scripts/start_application.sh
    - scripts/validate_service.sh
    - appspec.yml
    - buildspec.yml
    - docker-compose.yml
    - Dockerfile
    - index.html
    - nginx.conf
    - dist/**
cache:
  paths:
    - '/root/.npm/**/*'  # Cache npm dependencies to speed up subsequent builds
