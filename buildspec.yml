version: 0.2

env:
  image: "aws/codebuild/standard:5.0"  # Docker-enabled CodeBuild image

phases:
  install:
    commands:
      - echo Installing Docker...
      - docker --version  # Verify Docker installation
      - docker info  # Check Docker service status
      - echo Installing Docker Compose...
      - sudo curl -L https://github.com/docker/compose/releases/download/1.29.2/docker-compose-$(uname -s)-$(uname -m) -o /usr/local/bin/docker-compose  # Download Docker Compose
      - sudo chmod +x /usr/local/bin/docker-compose  # Make it executable
      - docker-compose --version  # Verify Docker Compose installation
  pre_build:
    commands:
      - echo Logging into Docker Hub (or private registry)...
      - echo $DOCKER_PASSWORD | docker login -u $DOCKER_USERNAME --password-stdin  # Replace with your Docker registry credentials if needed

  build:
    commands:
      - echo Building Docker images...
      - docker-compose -f docker-compose.yml build  # Build the Docker images from the docker-compose file

  post_build:
    commands:
      - echo Running post-build tasks...
      - docker-compose images  # List the images to confirm they've been built (optional)

artifacts:
  files:
    - '**/*'  # Include all necessary files (e.g., build artifacts or logs)
  discard-paths: yes

cache:
  paths:
    - '/root/.npm/**/*'  # Optional: Cache npm dependencies to speed up builds
