version: 0.2

env:
  image: "aws/codebuild/standard:5.0"  # Docker-enabled CodeBuild image

phases:
  install:
    commands:
      - echo Installing Docker...
      - docker --version  # Verify Docker installation
      - docker info  # Check Docker service status

  pre_build:
    commands:
      # Commenting out Docker login if not needed
      # - echo Logging into Docker Hub (or private registry)...
      # - echo $DOCKER_PASSWORD | docker login -u $DOCKER_USERNAME --password-stdin  # Skip Docker login if not needed

  build:
    commands:
      - echo Building Docker image...
      - docker build -t bgmgameresult:latest .  # Build the Docker image

  post_build:
    commands:
      - echo Docker image build complete.
      - docker images  # List images (optional)

artifacts:
  files:
    - '**/*'  # Include all necessary files

cache:
  paths:
    - '/root/.npm/**/*'  # Optional: Cache npm dependencies
