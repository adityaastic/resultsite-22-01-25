version: 0.2

env:
  image: "aws/codebuild/standard:5.0"  # Docker-enabled CodeBuild image

phases:
  install:
    commands:
      - echo Installing Docker...
      - curl -fsSL https://get.docker.com | sh  # Install Docker if it's not already installed
      - echo Installing Docker Compose...
      - curl -L https://github.com/docker/compose/releases/download/1.29.2/docker-compose-$(uname -s)-$(uname -m) -o /usr/local/bin/docker-compose  # Download Docker Compose
      - chmod +x /usr/local/bin/docker-compose  # Make it executable
      - docker-compose --version  # Verify Docker Compose installation
      - docker --version  # Verify Docker installation
      - docker-compose -v  # Ensure docker-compose is available
      - echo Building Docker containers using docker-compose...
      - docker-compose -f docker-compose.yml build
  pre_build:
    commands:
      - echo Logging into Docker Hub (or private registry)...
      - echo $DOCKER_PASSWORD | docker login -u $DOCKER_USERNAME --password-stdin  # Replace with your Docker registry credentials if needed

  build:
    commands:
      - echo Starting Docker containers...
      - docker-compose -f docker-compose.yml up -d  # Start containers in detached mode

  post_build:
    commands:
      - echo Running post-build tasks...
      - docker-compose logs  # View logs from Docker containers (optional)

artifacts:
  files:
    - '**/*'  # Include all necessary files (e.g., build artifacts or logs)
  discard-paths: yes

cache:
  paths:
    - '/root/.npm/**/*'  # Optional: Cache npm dependencies to speed up builds
