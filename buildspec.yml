version: 0.2

phases:
  install:
    runtime-versions:
      docker: 19  # Ensure you are using the correct Docker version for your build
    commands:
      - echo Installing dependencies...
      - docker-compose -f docker-compose.yml build  # Build Docker images using docker-compose

  pre_build:
    commands:
      - echo Logging into Docker Hub (or private registry)...
      - echo $DOCKER_PASSWORD | docker login -u $DOCKER_USERNAME --password-stdin  # Replace with your Docker registry credentials if needed

  build:
    commands:
      - echo Building and running containers...
      - docker-compose -f docker-compose.yml up -d  # Start containers in detached mode

  post_build:
    commands:
      - echo Running tests or other post-build tasks...
      # You can add additional steps like tests here, e.g., `docker exec web1 npm test`

artifacts:
  files:
    - '**/*'  # Include all necessary files (e.g., build artifacts or logs)
  discard-paths: yes

cache:
  paths:
    - '/root/.npm/**/*'  # Optional: Cache npm dependencies to speed up builds

